<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGSU AI Chatbot</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <button class="dark-mode-toggle" id="darkModeToggle" title="Toggle Dark Mode">🌙</button>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🎓 SGSU Chatbot</h1>
            <p>Ask me anything, I will answer campus-related queries 24x7.</p>
        </div>

        <div class="messages-area" id="messagesArea">
            <div class="welcome-message">
                <p><strong>Welcome to the SGSU Chatbot!</strong></p>
                <p style="margin-top: 8px; font-size: 13px;">Ask me anything about Scope Global Skills University, Get detailed course information 🎓</p>
            </div>
            <div class="suggestions-container" id="suggestionsContainer">
                <button class="suggestion-btn" onclick="selectSuggestion('Tell me about SGSU')">About SGSU</button>
                <button class="suggestion-btn" onclick="selectSuggestion('What are the admission requirements?')">Admission</button>
                <button class="suggestion-btn" onclick="selectSuggestion('Tell me about the programs and courses')">Programs</button>
                <button class="suggestion-btn" onclick="selectSuggestion('What are the placement opportunities?')">Placements</button>
                <button class="suggestion-btn" onclick="selectSuggestion('What are the fee details?')">Fee Structure</button>
                <button class="suggestion-btn" onclick="selectSuggestion('Tell me about campus facilities')">Facilities</button>
                <button class="suggestion-btn" onclick="selectSuggestion('What courses are available?')">All Courses</button>
                <button class="suggestion-btn" onclick="selectSuggestion('Tell me about B.Tech specializations')">B.Tech</button>
            </div>
        </div>

        <div class="input-area">
            <div class="input-group">
                <input
                    type="text"
                    id="questionInput"
                    placeholder="Ask me something..."
                    autocomplete="off"
                />
                <button id="sendBtn">Send</button>
            </div>
            <button class="clear-chat-btn" id="clearBtn">Clear</button>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
